name: 'Next.js Bundle Analysis'

on:
  pull_request:
  push:
    branches:
      - eternalsafe

permissions:
  contents: read # for checkout repository
  actions: read # for fetching base branch bundle stats
  pull-requests: write # for comments

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/workflows/yarn

      - name: Build next.js app
        uses: ./.github/workflows/build
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Analyze bundle
        run: npx -p nextjs-bundle-analysis report

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: .next/analyze/__bundle_analysis.json

      - name: Download base branch bundle stats
        if: success() && github.event.number
        run: bash ./scripts/github/download_bundle_analyser_artifact.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare with base branch bundle
        if: success() && github.event.number
        run: |
          if [ -d .next/analyze/base ]; then
            ls -laR .next/analyze/base
            npx -p nextjs-bundle-analysis compare
          else
            echo "No base bundle artifact found. Skipping bundle comparison."
          fi

      - name: Comment
        if: success() && github.event.number
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: next-bundle-analysis
          path: .next/analyze/__bundle_analysis_comment.txt
          ignore_empty: true
